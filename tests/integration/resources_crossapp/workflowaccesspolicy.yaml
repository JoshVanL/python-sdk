# Grants the caller app exactly the operations the cross-app tests exercise, and
# only on CrossAppWaitForEvent. Rules are an allow list: once any policy is
# loaded, anything unmatched is denied, which is what the denial test asserts.
apiVersion: dapr.io/v1alpha1
kind: WorkflowAccessPolicy
metadata:
  name: crossapp-host-policy
scopes:
  - wf-cross-app-host
spec:
  rules:
    - callers:
        - appID: 'wf-cross-app-caller'
      workflows:
        - name: 'CrossAppWaitForEvent'
          operations: [schedule, get, raise, pause, resume, purge, terminate]
